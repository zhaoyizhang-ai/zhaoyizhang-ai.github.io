# =============================================================================
# Personal website configuration
# Edit the PROFILE block first. All repeated site/author values below reuse
# YAML anchors from this block, so each personal value has one source of truth.
# See CUSTOMIZE_ME.md for the complete first-publish checklist.
# =============================================================================

profile:
  name: &profile_name "<NAME>"
  display_name: &profile_display_name "<DISPLAY_NAME>"
  github_username: &github_username "zhaoyizhang-ai"
  email: &profile_email "" # Replace with <EMAIL>; blank values stay hidden.
  location: &profile_location "" # Replace with <LOCATION>; optional.
  short_bio: &profile_short_bio "TODO: Add a one-sentence introduction."
  short_bio_zh: "TODO：添加一句中文简介。"
  long_bio: >-
    TODO: Replace this paragraph with <LONG_BIO>. Describe what you do, what
    you care about, and what visitors can find on this website.
  long_bio_zh: >-
    TODO：请用中文替换这段 <LONG_BIO> 占位内容，介绍你在做什么、关心什么，
    以及访客可以在这个网站找到哪些内容。
  current_status: "TODO: Add your current role, focus, or availability."
  current_status_zh: "TODO：添加你当前的身份、关注方向或可合作状态。"
  profile_photo: "" # Replace with <PROFILE_PHOTO>, e.g. /assets/images/profile/photo.jpg.
  cv_pdf: "/files/cv.pdf"
  social:
    github_url: "https://github.com/zhaoyizhang-ai"
    linkedin_url: "" # Replace with <LINKEDIN_URL>; optional.
    google_scholar_url: "" # Replace with <GOOGLE_SCHOLAR_URL>; optional.
    orcid: "" # Replace with <ORCID>; use the full https://orcid.org/... URL.
    x_url: "" # Replace with <X_URL>; optional.

# Basic site settings. The aliases below mirror the PROFILE block automatically.
locale: "en-US"
site_theme: "default"
title: *profile_display_name
title_separator: "·"
name: *profile_name
description: *profile_short_bio
url: "https://zhaoyizhang-ai.github.io"
baseurl: ""
repository: "zhaoyizhang-ai/zhaoyizhang-ai.github.io"
timezone: "Asia/Shanghai"

# Compatibility values used by the inherited Academic Pages layouts and feed.
author:
  name: *profile_display_name
  bio: *profile_short_bio
  location: *profile_location
  email: *profile_email
  github: *github_username

# Optional integrations. Every integration is disabled until both `enabled`
# and its required values are explicitly provided.
features:
  google_analytics:
    enabled: false
    measurement_id: "" # Never commit a secret; GA measurement IDs are public config.
  plausible:
    enabled: false
    domain: ""
    script_url: "https://plausible.io/js/script.js"
  giscus:
    enabled: false
    repo: ""
    repo_id: ""
    category: "Announcements"
    category_id: ""
    mapping: "pathname"
  custom_domain:
    enabled: false
    domain: ""
  google_search_console:
    enabled: false
    verification_code: ""

# Content and presentation.
breadcrumbs: false
words_per_minute: 200
future: false
read_more: "disabled"
teaser: ""
og_image: "/assets/images/site/og-placeholder.png"
og_description: *profile_short_bio
atom_feed:
  hide: false
  path: "/feed.xml"

# Social metadata only includes known, valid URLs. Add optional profiles after
# replacing their blank values in the PROFILE block.
social:
  type: "Person"
  name: *profile_display_name
  links:
    - "https://github.com/zhaoyizhang-ai"

twitter:
  username: ""

# Legacy integration keys retained for template compatibility and kept off.
comments:
  provider: ""
analytics:
  provider: "false"
google_site_verification: ""
bing_site_verification: ""
yandex_site_verification: ""

# Files and collections.
include:
  - _pages
  - files
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - .tool-versions
  - CHANGELOG
  - CUSTOMIZE_ME.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - scripts
  - tmp
  - vendor
  - vendor/bundle
  - assets/images/profile/README.md
  - assets/images/icons/README.md
  - assets/images/projects/README.md
  - assets/images/blog/README.md
  - assets/images/publications/README.md
  - assets/images/site/README.md
  - files/publications/README.md
  - files/downloads/README.md
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown processing.
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "<!--more-->"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..4
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Notes are short-form and remain separate from dated blog posts.
collections:
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: false
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: notes
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false
      toc: true

# Sass and output.
sass:
  sass_dir: _sass
  style: compressed
permalink: /blog/:year/:month/:day/:title/

# All plugins below are supported by GitHub Pages.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

category_archive:
  type: liquid
  path: /blog/categories/
tag_archive:
  type: liquid
  path: /blog/tags/

compress_html:
  clippings: all
  ignore:
    envs: development
