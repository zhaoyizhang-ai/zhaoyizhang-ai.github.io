name: Build, validate, and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby and install locked gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Validate YAML and content schema
        run: bundle exec ruby scripts/validate_content.rb

      - name: Lint Markdown
        run: npm run lint:md

      - name: Rebuild and verify JavaScript bundle
        run: |
          npm run build:js
          git diff --exit-code -- assets/js/main.min.js

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Verify required pages, SEO, RSS, sitemap, and 404
        run: bundle exec ruby scripts/verify_build.rb _site

      - name: Check generated HTML and internal links
        run: bundle exec htmlproofer ./_site --disable-external

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
