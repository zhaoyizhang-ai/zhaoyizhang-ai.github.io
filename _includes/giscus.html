{% assign giscus = site.features.giscus %}
{% if giscus.enabled == true and giscus.repo != "" and giscus.repo_id != "" and giscus.category_id != "" %}
  <section class="page__comments" aria-label="Comments">
    <h2>Comments</h2>
    <script src="https://giscus.app/client.js"
      data-repo="{{ giscus.repo }}"
      data-repo-id="{{ giscus.repo_id }}"
      data-category="{{ giscus.category }}"
      data-category-id="{{ giscus.category_id }}"
      data-mapping="{{ giscus.mapping }}"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="preferred_color_scheme"
      data-lang="en"
      crossorigin="anonymous"
      async>
    </script>
  </section>
{% endif %}
