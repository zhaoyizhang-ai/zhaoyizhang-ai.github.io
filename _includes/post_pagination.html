{% include base_path %}

{% if page.previous or page.next %}
  <nav class="pagination">
    {% if page.previous %}
      <a href="{{ base_path }}{{ page.previous.url }}" class="pagination--pager" title="{{ page.previous.title | markdownify | strip_html }}" data-i18n="previous">Previous</a>
    {% else %}
      <a href="#" class="pagination--pager disabled" data-i18n="previous">Previous</a>
    {% endif %}
    {% if page.next %}
      <a href="{{ base_path }}{{ page.next.url }}" class="pagination--pager" title="{{ page.next.title | markdownify | strip_html }}" data-i18n="next">Next</a>
    {% else %}
      <a href="#" class="pagination--pager disabled" data-i18n="next">Next</a>
    {% endif %}
  </nav>
{% endif %}
