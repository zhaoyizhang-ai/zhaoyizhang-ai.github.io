<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img"><rect width="640" height="390" rx="14" fill="#f5f2e9"/><defs><marker id="26443c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26443c"/></marker><marker id="326d93" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326d93"/></marker><marker id="b34d2d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34d2d"/></marker><marker id="39765b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39765b"/></marker><marker id="8b958b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b958b"/></marker></defs><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#26443c"><text x="25" y="35" font-size="22" fill="#26443c" text-anchor="start">同一物体固定在匀速转盘上</text><circle cx="175" cy="175" r="90" fill="none" stroke="#8b958b" stroke-width="2"/><circle cx="245" cy="175" r="12" fill="white" stroke="#26443c" stroke-width="2"/><path d="M240,175 L165,175" fill="none" stroke="#39765b" stroke-width="3" marker-end="url(#39765b)"/><text x="80" y="300" font-size="20" fill="#39765b" text-anchor="start">惯性系：真实合力向内</text><text x="80" y="332" font-size="19" fill="#26443c" text-anchor="start">提供向心加速度</text><circle cx="470" cy="175" r="90" fill="none" stroke="#8b958b" stroke-width="2"/><circle cx="540" cy="175" r="12" fill="white" stroke="#26443c" stroke-width="2"/><path d="M535,175 L460,175" fill="none" stroke="#39765b" stroke-width="3" marker-end="url(#39765b)"/><path d="M553,175 L620,175" fill="none" stroke="#b34d2d" stroke-width="3" marker-end="url(#b34d2d)"/><text x="375" y="300" font-size="20" fill="#b34d2d" text-anchor="start">转动系：补入向外离心力</text><text x="375" y="332" font-size="18" fill="#26443c" text-anchor="start">物体相对静止，表观平衡</text><text x="400" y="100" font-size="22" fill="#26443c" text-anchor="start">ω ⊙</text><text x="31" y="374" font-size="19" fill="#26443c" text-anchor="start">离心力用到转轴的距离，不是任意原点距离。</text></g></svg>