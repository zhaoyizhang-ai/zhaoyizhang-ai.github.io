<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img"><rect width="640" height="340" rx="14" fill="#f5f2e9"/><defs><marker id="26443c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26443c"/></marker><marker id="326d93" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326d93"/></marker><marker id="b34d2d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34d2d"/></marker><marker id="39765b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39765b"/></marker><marker id="8b958b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b958b"/></marker></defs><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#26443c"><text x="25" y="35" font-size="22" fill="#26443c" text-anchor="start">总动量为零，仍然可以有动能</text><circle cx="240" cy="180" r="110" fill="none" stroke="#8b958b" stroke-width="2"/><circle cx="300" cy="105" r="10" fill="#d9e8eb" stroke="#26443c" stroke-width="2"/><circle cx="180" cy="255" r="10" fill="#d9e8eb" stroke="#26443c" stroke-width="2"/><path d="M300,105 L235,55" fill="none" stroke="#326d93" stroke-width="3" marker-end="url(#326d93)"/><path d="M180,255 L245,305" fill="none" stroke="#326d93" stroke-width="3" marker-end="url(#326d93)"/><text x="320" y="100" font-size="20" fill="#26443c" text-anchor="start">dm，v</text><text x="70" y="277" font-size="20" fill="#26443c" text-anchor="start">dm，−v</text><circle cx="240" cy="180" r="4" fill="#26443c" stroke="#26443c" stroke-width="2"/><text x="252" y="185" font-size="21" fill="#26443c" text-anchor="start">C</text><text x="385" y="130" font-size="21" fill="#26443c" text-anchor="start">动量相消：</text><text x="385" y="167" font-size="17" fill="#26443c" text-anchor="start">dm v + dm (−v) = 0</text><text x="385" y="225" font-size="21" fill="#26443c" text-anchor="start">动能相加：</text><text x="385" y="262" font-size="18" fill="#26443c" text-anchor="start">两项 ½ dm v² 都为正</text></g></svg>